<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UMKM DESA WANAJAYA</title>
    <style>
                /* STYLING SEARCH BAR */
        .search-container {
            padding: 0 15px !important;
            margin: 12px 0 10px 0 !important;
        }

        #input-cari {
            width: 100% !important;
            padding: 10px 16px !important;
            border-radius: 25px !important;
            border: 2px solid #1b4332 !important;
            outline: none !important;
            font-size: 12px !important;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08) !important;
            box-sizing: border-box !important;
            background-color: #ffffff !important;
            color: #333333 !important;
        }

        #input-cari:focus {
            border-color: #2E7D32 !important;
            box-shadow: 0 3px 10px rgba(46,125,50,0.2) !important;
        }

        /* GRID TOKO RAPI */
        .grid-toko {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 10px !important;
            padding: 0 12px !important;
            margin-bottom: 20px !important;
            align-content: start !important;
        }

        /* KOTAK TOKO KECIL & PRESISI (DIKUNCI TINGGINYA) */
        .kotak-toko {
            background: #1b4332 !important; 
            border-radius: 12px !important;
            padding: 10px 4px !important;
            text-align: center !important;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15) !important; 
            cursor: pointer !important;
            border: 1px solid #133226 !important; 
            
            /* Kunci tinggi kotak agar tidak bisa molor */
            height: 115px !important;
            max-height: 115px !important;
            
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            overflow: hidden !important;
        }

        /* FOTO KONTROL KETAT (TIDAK BISA MEMBESAR) */
        .kotak-toko img, .icon-toko-img {
            width: 46px !important;
            height: 46px !important;
            min-width: 46px !important;
            min-height: 46px !important;
            max-width: 46px !important;
            max-height: 46px !important;
            object-fit: cover !important;
            border-radius: 50% !important;
            margin: 0 auto 6px auto !important;
            border: 2px solid #ffffff !important;
            flex-shrink: 0 !important;
        }

        /* TEKS NAMA TOKO */
        .nama-toko { 
            font-size: 11px !important; 
            font-weight: bold !important; 
            color: #ffffff !important; 
            line-height: 1.2 !important; 
            display: block !important;
            text-align: center !important;
        }

        
                /* 2 TOMBOL PILIHAN PESAN WA */
        .btn-wa-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-wa-pickup {
            display: block; background: linear-gradient(135deg, #1565C0 0%, #1E88E5 100%); color: white;
            padding: 10px; border-radius: 10px; text-decoration: none;
            font-size: 13px; font-weight: bold; box-shadow: 0 3px 8px rgba(21,101,192,0.3);
        }
        .btn-wa-cod {
            display: block; background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white;
            padding: 10px; border-radius: 10px; text-decoration: none;
            font-size: 13px; font-weight: bold; box-shadow: 0 3px 8px rgba(37,211,102,0.3);
        }
        .btn-wa-pickup:active, .btn-wa-cod:active { transform: scale(0.98); }

        <style>
        /* PENGATURAN DASAR & LATAR BERPATERN */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    
    body { 
        background-color: #e9ecef; /* Mengubah warna latar luar menjadi abu-abu muda netral */
        display: flex; 
        justify-content: center; 
    }
    
    .app-container {

    }
            .header-logo {
        max-height: 52px !important; /* Diatur ke ukuran sedang yang proporsional */

            display: block !important;
    }

    header h1 { font-size: 22px; margin-bottom: 3px; letter-spacing: 1px; }
    header p { font-size: 11px !important;
            opacity: 0.9;
            font-weight: 300;
            margin: 0 !important;
            line-height: 1.2 !important; }
    
    .news-ticker { background: linear-gradient(90deg, #F57C00 0%, #ff9800 100%) !important; 
            color: white !important; 
            display: flex !important; 
            align-items: center !important;

            font-size: 11px !important;

            position: relative !important;

            border-radius: 20px !important; 
            box-shadow: 0 3px 8px rgba(245,124,0,0.25) !important; 
        }

        .news-ticker span { 
            margin-right: 8px !important; 
            white-space: nowrap !important;
            font-size: 11px !important;
            display: inline-block !important;
        }

        .news-ticker marquee {
            font-size: 11px !important;
            vertical-align
         }

    /* SLIDER DENGAN BORDER EMAS */
        .slider-container {
        width: 100%;            
        aspect-ratio: 2 / 1;    /* Rasio banner (bisa diganti 16 / 9 jika gambar lebih lebar) */
        height: auto;           /* Hapus angka px agar tidak mengunci tinggi slider */
        margin: 15px 0;
        overflow: hidden;
        position: relative;
        background-color: #000; /* Warna latar belakang jika ada sisa ruang */
    }

    .slide {
        width: 100%; height: 100%; 
        object-fit: cover;
        position: absolute; top: 0; left: 0;
        opacity: 0; transition: opacity 0.8s ease-in-out;
    }
    .slide.active { opacity: 1; }

    /* MENU GRID KOTAK DENGAN AKSEN / CORAK CANTIK */
    .section-title { text-align: center; font-size: 15px; color: #1b4332; margin: 15px 0 12px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .grid-toko {
        display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 15px;
            align-content: start; /* Mencegah baris ditarik molor ke bawah */
    }
     .kotak-toko {
        /* Menggunakan warna hijau gelap sesuai tema header agar teks putih terlihat jelas */
        background: #1b4332; 
        border-radius: 12px;
        padding: 14px 6px;
        text-align: center;
        /* Bayangan sedikit disesuaikan agar cocok dengan warna gelap */
        box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
        cursor: pointer;
        transition: all 0.2s ease;
        /* Hapus border atas lama, ganti dengan border tipis di sekelilingnya */
        border: 1px solid #133226; 
        position: relative;
        overflow: hidden;
    }

     .nama-toko { 
        font-size: 11px; 
        font-weight: bold; 
        color: #ffffff; /* Wajib diubah jadi putih agar terbaca di atas background hijau */
        line-height: 1.2; 
    }
        .bottom-accent .watermark-text {
            font-size: 9px; /* Ukuran kecil khas watermark */
            color: #ffffff; /* Warna putih */
            font-weight: 500;
            letter-spacing: 1.5px; /* Spasi antar huruf renggang agar terkesan premium */
            text-transform: uppercase; /* Huruf kapital rapi */
            opacity: 0.85; /* Sedikit efek samar khas watermark */
        }

    /* POP-UP (MODAL) PRODUK & WHATSAPP */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.65); backdrop-filter: blur(2px);
        display: none; justify-content: center; align-items: center;
        z-index: 100; opacity: 0; transition: opacity 0.3s;
    }
    .modal-overlay.show { display: flex; opacity: 1; }
    .modal-content {
        background: white; width: 85%; max-width: 310px;
        border-radius: 18px; padding: 20px; text-align: center;
        position: relative; transform: translateY(20px); transition: transform 0.3s;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-overlay.show .modal-content { transform: translateY(0); }
    .close-btn {
        position: absolute; top: 10px; right: 15px;
        font-size: 22px; color: #aaa; cursor: pointer; font-weight: bold;
    }
    .modal-img { width: 100%; height: 150px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; background: #eee; }
    .modal-nama-toko { font-size: 12px; color: #F57C00; font-weight: bold; margin-bottom: 4px; }
    .modal-produk { font-size: 17px; color: #222; font-weight: bold; margin-bottom: 4px; }
    .modal-harga { font-size: 15px; color: #2E7D32; font-weight: bold; margin-bottom: 18px; }
    .btn-wa {
        display: block; background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white;
        padding: 12px; border-radius: 10px; text-decoration: none;
        font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(37,211,102,0.3);
    }
    .btn-wa:active { transform: scale(0.98); }
   .app-container {
        padding-bottom: 0px; /* Reset padding-bottom lama */
        overflow-x: hidden;
    }

    .bottom-accent {
        width: 100%;
        height: 30px; /* Tinggi baris tipis saja */
        margin-top: 15px; /* Jarak dari grid menu ke aksen bawah */
        background: linear-gradient(135deg, #1b4332 0%, #2E7D32 100%); /* Warna hijau gradasi sesuai header */
        border-top-left-radius: 12px; /* Melengkung di bagian atas saja */
        border-top-right-radius: 12px;
        box-shadow: 0 -3px 8px rgba(0,0,0,0.1); /* Bayangan ke atas */
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        z-index: 10;
    }      
        /* KELAS UNTUK MENYEMBUNYIKAN TOKO SAAT DICARI */
.sembunyi {
    display: none !important;
}
</style>

<body>

    <div class="app-container">
        
                <!-- Header -->
        <header>
            <img src="https://i.ibb.co.com/3Yhmhzn1/1000108729-removebg-preview.png" alt="Logo UMKM Desa Wanajaya" class="header-logo">
            <p>UMKM DESA WANAJAYA</p>
        </header>


        <!-- Berita Jalan -->
        <div class="news-ticker">
            <span>📢 INFO:</span>
            <marquee id="teks-berita">Memuat informasi...</marquee>
        </div>

        <!-- Slider Kecil 3 Gambar -->
        <div class="slider-container">
            <img src="" class="slide active" id="slide1">
            <img src="" class="slide" id="slide2">
            <img src="" class="slide" id="slide3">
        </div>

        <!-- Menu Utama (6 Toko) -->
<!-- KOLOM PENCARIAN SELEKTIF -->
<div class="search-container">
    <input type="text" id="input-cari" onkeyup="filterToko()" placeholder="🔍 Cari toko atau makanan (cth: Seblak, Batagor)...">
</div>
        
        <h2 class="section-title">HARI INI MAU JAJAN APA?</h2>
        <div class="grid-toko" id="tempat-toko">
            <!-- Kotak akan dimuat oleh JavaScript -->
        </div>
    
<!-- WATERMARK PRIO JATMIKO -->
 <div class="bottom-accent"> <span class="watermark-text
        font-size: 11px;
        color: #ffffff; /* Warna teks putih agar terbaca */
        font-weight: bold;
        letter-spacing: 0.5px;
        
         <div class="bottom-accent">
            <span class="watermark-text">Aplikasi ini dibuat oleh Prio Jatmiko</span>
        </div>
        <!-- Pop-up Detail & Pesan WA -->
        <div class="modal-overlay" id="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="tutupPopup()">&times;</span>
                <img src="" id="popup-img" class="modal-img">
                <div class="modal-nama-toko" id="popup-toko">🏪 Nama Toko</div>
                <div class="modal-produk" id="popup-produk">Nama Produk</div>
                <div class="modal-harga" id="popup-harga">Rp 0</div>
                               <!-- Ganti tombol WA lama dengan grup 2 tombol ini -->
                <div class="btn-wa-group">
                    <a href="#" id="popup-wa-pickup" class="btn-wa-pickup" target="_blank">🚶 Datang / Ambil Sendiri</a>
                    <a href="#" id="popup-wa-cod" class="btn-wa-cod" target="_blank">🛵 Antar / Sistem COD</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // FUNGSI PENCARIAN OTOMATIS (FIX)
        function filterToko() {
            const kataKunci = document.getElementById("input-cari").value.toLowerCase();
            const semuaKotak = document.querySelectorAll(".kotak-toko");

            semuaKotak.forEach(kotak => {
                const namaToko = kotak.textContent.toLowerCase();
                if (namaToko.includes(kataKunci)) {
                    kotak.classList.remove("sembunyi");
                } else {
                    kotak.classList.add("sembunyi");
                }
            });
        }

        // ==========================================
        // DATA ADMIN (SILAKAN EDIT DI SINI)
        // ==========================================
        const dataAdmin = {
            berita: "Dagang Setiap Hari !! GASSS ORDER",
            
            // Masukkan 3 Link Gambar untuk Slider
            slider: [
                "https://i.ibb.co.com/Tq127HDv/1a1f7be5-32ab-4592-acdf-621b1d0e0a05.png=400&q=80",
                "https://i.ibb.co.com/WWR2F8Cz/354219c3-b7f2-4f17-9ba2-34b8e70dd327.png=400&q=80",
                "https://i.ibb.co.com/q3bHgG1f/ac4949f8-bf16-4ac1-851f-85ed17b2da2e.png=400&q=80",
            ],
            // Data 6 Toko/Pedagang
            daftarToko: [
                { id: 1, nama: "BATAGOR BANDUNG", ikon: "https://i.ibb.co.com/Xr4nXS3M/ea78eed5-b074-4ab5-9e6f-c25da8336de1.png", produk: "BATAGOR", harga: "Mulai Rp 5.000", gambar: "https://i.ibb.co.com/Xr4nXS3M/ea78eed5-b074-4ab5-9e6f-c25da8336de1.png=400&q=80", wa: "6282130632696" },
                { id: 2, nama: "KORDOG MOZARELA", ikon: "https://i.ibb.co.com/W42TdPkV/9995928c-31f2-4043-a971-9920b19216d0.png", produk: "KORDOG", harga: "Rp 5.000", gambar: "https://i.ibb.co.com/W42TdPkV/9995928c-31f2-4043-a971-9920b19216d0.png=400&q=80", wa: "6281234567891" },
                { id: 3, nama: "KENTANG SPIRAL", ikon: "https://i.ibb.co.com/FqHJtJN9/28b8f56c-c4cf-4871-b563-8d6c484dfe12-1.png", produk: "KENTANG ROOL", harga: "Rp 5.000", gambar: "https://i.ibb.co.com/FqHJtJN9/28b8f56c-c4cf-4871-b563-8d6c484dfe12-1.png=400&q=80", wa: "6281234567892" },
                { id: 4, nama: "TELUR GULUNG", ikon: "https://i.ibb.co.com/cS833WCm/365a7ae5-5e65-4a30-8f77-3e7a133896b3.png", produk: "Kopi Hitam Tumbuk Asli", harga: "Rp 12.000", gambar: "https://images.unsplash.com/photo-1559525839-b184a4d698c7?w=400&q=80", wa: "6281234567893" },
                { id: 5, nama: "SEBLAK SPECIAL", ikon: "🧺", produk: "Tas Anyaman Bambu", harga: "Rp 50.000", gambar: "https://images.unsplash.com/photo-1590736969955-71cc94801759?w=400&q=80", wa: "6281234567894" },
                { id: 6, nama: "SOSIS BAKAR", ikon: "🐓", produk: "Ayam Siap Potong", harga: "Rp 75.000/Ekor", gambar: "https://images.unsplash.com/photo-1542834369-f10ebf06d3e0?w=400&q=80", wa: "6281234567895" }
            ]
        };

        // ==========================================
        // MESIN APLIKASI (TIDAK PERLU DIUBAH)
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Tampilkan Berita
            document.getElementById("teks-berita").textContent = dataAdmin.berita;

            // 2. Setup Slider
            document.getElementById("slide1").src = dataAdmin.slider[0];
            document.getElementById("slide2").src = dataAdmin.slider[1];
            document.getElementById("slide3").src = dataAdmin.slider[2];

            let slideIndex = 0;
            const slides = document.querySelectorAll(".slide");
            setInterval(() => {
                slides[slideIndex].classList.remove("active");
                slideIndex = (slideIndex + 1) % slides.length;
                slides[slideIndex].classList.add("active");
            }, 4000); // Ganti gambar setiap 4 detik

            // 3. Tampilkan 6 Kotak Menu Toko
            const tempatToko = document.getElementById("tempat-toko");
            dataAdmin.daftarToko.forEach(toko => {
                const kotakHtml = `
                    <div class="kotak-toko" onclick="bukaPopup(${toko.id})">
                <img src="${toko.ikon}" alt="${toko.nama}" class="icon-toko-img">
                <span class="nama-toko">${toko.nama}</span>
            </div>
                `;
                tempatToko.innerHTML += kotakHtml;
            });
        });

        // 4. Fungsi Pop-up
        const modal = document.getElementById("modal");

        function bukaPopup(idToko) {
            const toko = dataAdmin.daftarToko.find(t => t.id === idToko);
            document.getElementById("popup-img").src = toko.gambar;
            document.getElementById("popup-toko").textContent = `🏪 ${toko.nama}`;
            document.getElementById("popup-produk").textContent = toko.produk;
            document.getElementById("popup-harga").textContent = toko.harga;
            
            // 1. Format Pesan WA untuk Ambil Sendiri
            const pesanPickup = `Halo ${toko.nama}, saya mau pesan: ${toko.produk}. Saya mau datang/ambil sendiri ya!`;
            document.getElementById("popup-wa-pickup").href = `https://wa.me/${toko.wa}?text=${encodeURIComponent(pesanPickup)}`;
            
            // 2. Format Pesan WA untuk COD / Diantar
            const pesanCOD = `Halo ${toko.nama}, saya mau pesan: ${toko.produk} via COD. Hari ini jualan di mana / bisa diantar?`;
            document.getElementById("popup-wa-cod").href = `https://wa.me/${toko.wa}?text=${encodeURIComponent(pesanCOD)}`;
            
            modal.classList.add("show");
        }

        
    
        function tutupPopup() {
            modal.classList.remove("show");
        }

        // Tutup pop-up jika klik di area luar kotak putih
        window.onclick = function(event) {
            if (event.target == modal) {
                tutupPopup();
            }
        }
    </script>
