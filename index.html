<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UMKM DESA WANAJAYA</title>
    <style>
        /* PENGATURAN DASAR - MOBILE FIRST */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #e9ecef; display: flex; justify-content: center; }
        
        /* Membungkus tampilan agar mirip layar HP di tengah layar laptop */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #f4f7f6;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 20px;
        }

        /* HEADER & BERITA */
        header { background-color: #2E7D32; color: white; text-align: center; padding: 15px 10px; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; }
        header h1 { font-size: 22px; margin-bottom: 5px; }
        header p { font-size: 12px; opacity: 0.9; }
        
        .news-ticker { background-color: #F57C00; color: white; display: flex; padding: 8px 15px; font-size: 13px; font-weight: bold; margin-top: -10px; z-index: 10; position: relative; width: 90%; margin-left: auto; margin-right: auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .news-ticker span { margin-right: 10px; }

        /* SLIDER KECIL (DIPERBARUI) */
        .slider-container {
            width: 80%; /* Lebar dikecilkan */
            max-width: 300px;
            height: 140px;
            margin: 25px auto; /* Di tengah */
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: #ddd;
        }
        .slide {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; top: 0; left: 0;
            opacity: 0; transition: opacity 0.8s ease-in-out;
        }
        .slide.active { opacity: 1; }

        /* GRID TOKO (6 KOTAK MENU) */
        .section-title { text-align: center; font-size: 16px; color: #2E7D32; margin: 10px 0 15px 0; font-weight: bold; }
        .grid-toko {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 0 20px;
        }
        .kotak-toko {
            background: white;
            border-radius: 12px;
            padding: 15px 5px;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #eee;
        }
        .kotak-toko:active { transform: scale(0.95); background-color: #f0f0f0; }
        .icon-toko { font-size: 32px; margin-bottom: 8px; display: block; }
        .nama-toko { font-size: 12px; font-weight: bold; color: #333; line-height: 1.2; }
<!-- WATERMARK PRIO JATMIKO -->
<div style="text-align: center; padding: 30px 10px 15px 10px; font-size: 11px; color: #888; font-weight: bold;">
    Aplikasi ini dibuat oleh Prio Jatmiko
</div>
        
        /* POP-UP (MODAL) PRODUK & WHATSAPP */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content {
            background: white; width: 85%; max-width: 320px;
            border-radius: 15px; padding: 20px; text-align: center;
            position: relative; transform: translateY(20px); transition: transform 0.3s;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .close-btn {
            position: absolute; top: 10px; right: 15px;
            font-size: 24px; color: #999; cursor: pointer; font-weight: bold;
        }
        .modal-img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; background: #eee; }
        .modal-nama-toko { font-size: 13px; color: #F57C00; font-weight: bold; margin-bottom: 5px; }
        .modal-produk { font-size: 18px; color: #333; font-weight: bold; margin-bottom: 5px; }
        .modal-harga { font-size: 16px; color: #2E7D32; font-weight: bold; margin-bottom: 20px; }
        .btn-wa {
            display: block; background-color: #25D366; color: white;
            padding: 12px; border-radius: 8px; text-decoration: none;
            font-size: 15px; font-weight: bold; box-shadow: 0 2px 5px rgba(37,211,102,0.4);
        }
        .btn-wa:active { background-color: #128C7E; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>UMKM DESA WANAJAYA</h1>
            <p>JAJAN DI MANAPUN TINGGAL KLIK</p>
        </header>

        <!-- Berita Jalan -->
        <div class="news-ticker">
            <span>📢 INFO:</span>
            <marquee id="teks-berita">Memuat informasi...</marquee>
        </div>

        <!-- Slider Kecil 3 Gambar -->
        <div class="slider-container">
            <img src="" class="slide active" id="slide1">
            <img src="" class="slide" id="slide2">
            <img src="" class="slide" id="slide3">
        </div>

        <!-- Menu Utama (6 Toko) -->
        <h2 class="section-title">HARI INI MAU JAJAN APA?</h2>
        <div class="grid-toko" id="tempat-toko">
            <!-- Kotak akan dimuat oleh JavaScript -->
        </div>

        <!-- Pop-up Detail & Pesan WA -->
        <div class="modal-overlay" id="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="tutupPopup()">&times;</span>
                <img src="" id="popup-img" class="modal-img">
                <div class="modal-nama-toko" id="popup-toko">🏪 Nama Toko</div>
                <div class="modal-produk" id="popup-produk">Nama Produk</div>
                <div class="modal-harga" id="popup-harga">Rp 0</div>
                <a href="#" id="popup-wa" class="btn-wa" target="_blank">📲 Pesan Sekarang</a>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // DATA ADMIN (SILAKAN EDIT DI SINI)
        // ==========================================
        const dataAdmin = {
            berita: "Dagang Setiap Hari !! GASSS ORDER",
            
            // Masukkan 3 Link Gambar untuk Slider
            slider: [
                "https://i.postimg.cc/qRLPMQ6B/8c8ed67f-80f3-48c5-8c83-7935cdc7f5f8.png=400&q=80",
                "https://i.postimg.cc/6QQjfwy0/271ff1bd-0715-408c-8921-fe1017f2f969-(1).png=400&q=80",
                "https://i.postimg.cc/PrhMMh7c/ac4949f8-bf16-4ac1-851f-85ed17b2da2e.png=400&q=80",
            ],
            // Data 6 Toko/Pedagang
            daftarToko: [
                { id: 1, nama: "BATAGOR MANG SUTUR", ikon: "🧆", produk: "BATAGOR", harga: "Mulai Rp 5.000", gambar: "https://i.postimg.cc/QdFHjmhg/images-(17).jpg=400&q=80", wa: "6282130632696" },
                { id: 2, nama: "KORDOG MANG KENDOL", ikon: "🌭", produk: "KORDOG", harga: "Rp 5.000", gambar: "https://images.unsplash.com/photo-1566385101042-1a0aa0c1268c?w=400&q=80", wa: "6281234567891" },
                { id: 3, nama: "KENTANG ROLL MANG ASIM", ikon: "🍡", produk: "Brownies & Bolu Lumer", harga: "Rp 35.000", gambar: "https://images.unsplash.com/photo-1606890737304-57a1ca8a5b62?w=400&q=80", wa: "6281234567892" },
                { id: 4, nama: "Kopi Abah", ikon: "☕", produk: "Kopi Hitam Tumbuk Asli", harga: "Rp 12.000", gambar: "https://images.unsplash.com/photo-1559525839-b184a4d698c7?w=400&q=80", wa: "6281234567893" },
                { id: 5, nama: "Kerajinan Kang", ikon: "🧺", produk: "Tas Anyaman Bambu", harga: "Rp 50.000", gambar: "https://images.unsplash.com/photo-1590736969955-71cc94801759?w=400&q=80", wa: "6281234567894" },
                { id: 6, nama: "Ayam Kampung", ikon: "🐓", produk: "Ayam Siap Potong", harga: "Rp 75.000/Ekor", gambar: "https://images.unsplash.com/photo-1542834369-f10ebf06d3e0?w=400&q=80", wa: "6281234567895" }
            ]
        };

        // ==========================================
        // MESIN APLIKASI (TIDAK PERLU DIUBAH)
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Tampilkan Berita
            document.getElementById("teks-berita").textContent = dataAdmin.berita;

            // 2. Setup Slider
            document.getElementById("slide1").src = dataAdmin.slider[0];
            document.getElementById("slide2").src = dataAdmin.slider[1];
            document.getElementById("slide3").src = dataAdmin.slider[2];

            let slideIndex = 0;
            const slides = document.querySelectorAll(".slide");
            setInterval(() => {
                slides[slideIndex].classList.remove("active");
                slideIndex = (slideIndex + 1) % slides.length;
                slides[slideIndex].classList.add("active");
            }, 3000); // Ganti gambar setiap 3 detik

            // 3. Tampilkan 6 Kotak Menu Toko
            const tempatToko = document.getElementById("tempat-toko");
            dataAdmin.daftarToko.forEach(toko => {
                const kotakHtml = `
                    <div class="kotak-toko" onclick="bukaPopup(${toko.id})">
                        <span class="icon-toko">${toko.ikon}</span>
                        <span class="nama-toko">${toko.nama}</span>
                    </div>
                `;
                tempatToko.innerHTML += kotakHtml;
            });
        });

        // 4. Fungsi Pop-up
        const modal = document.getElementById("modal");
        
        function bukaPopup(idToko) {
            // Cari data toko yang di klik
            const toko = dataAdmin.daftarToko.find(t => t.id === idToko);
            
            // Isi pop-up dengan data toko tersebut
            document.getElementById("popup-img").src = toko.gambar;
            document.getElementById("popup-toko").textContent = `🏪 ${toko.nama}`;
            document.getElementById("popup-produk").textContent = toko.produk;
            document.getElementById("popup-harga").textContent = toko.harga;
            
            // Buat Link WA otomatis
            const pesan = `Halo ${toko.nama}, saya mau pesan: ${toko.produk}. Apakah bisa?`;
            const linkWA = `https://wa.me/${toko.wa}?text=${encodeURIComponent(pesan)}`;
            document.getElementById("popup-wa").href = linkWA;
            
            // Tampilkan pop-up
            modal.classList.add("show");
        }

        function tutupPopup() {
            modal.classList.remove("show");
        }

        // Tutup pop-up jika klik di area luar kotak putih
        window.onclick = function(event) {
            if (event.target == modal) {
                tutupPopup();
            }
        }
    </script>
</body>
</html>
